# Sakura River HD — ustawienia. Ten plik leży obok gry; zmiany działają po ponownym uruchomieniu.
# Każde ustawienie można też podać w linii poleceń, np.  SakuraRiver.exe -channel=twojkanal -time=night

# kanał Twitcha (bez #). Pusty = tryb demo ze sztucznym czatem
channel =

# pora dnia: dawn (świt) | day (dzień) | sunset (zachód) | night (noc) | godzina, np. 19.5
time = day
# pełna doba w minutach (0 = stała pora)
cycle = 0

# punkt widokowy: river | fuji | bridge | bridge2 | bridgeside | pagoda
view = river

# grafika: auto | low | medium | high | ultra | rtx | cinematic   (auto = rtx, jeśli karta ma sprzętowy ray tracing)
graphics = auto

# wiadomości płynące po wodzie, lampiony z prawdziwym światłem (po jednym na osobę), nicki
text = 1
lanterns = 0
names = 0
textsize = 1

# płatki, świetliki, przeloty kamery co kilka minut
petals = 1
fireflies = 1
camera = 0

# ile wiadomości naraz, ile sekund trzyma się pora dnia z czatu, cooldown komend w sekundach
max = 50
hold = 120
cooldown = 12

# okno i klatki — w OBS: Przechwytywanie gry / okna (albo NDI poniżej)
res = 1920x1080
fullscreen = 0
fps = 60

# wyjście NDI (OBS: wtyczka DistroAV) — obraz idzie też przy zminimalizowanym oknie
ndi = 0
ndiname = Sakura River HD
